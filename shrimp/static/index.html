<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nhật ký nuôi tôm</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;700;800&display=swap">
<style>
:root {
  --bg: #EEF2F1;
  --card-bg: #FFFFFF;
  --border: #D5DEDC;
  --ink: #0E2A2B;
  --muted: #4B5F5F;
  --brand-dark: #0F3B3C;
  --primary-teal: #0F6B63;
  --amber: #8A5A00;
  --warm-red: #C4421E;
  --demo-yellow: #FFD23F;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: "Be Vietnam Pro", system-ui, -apple-system, sans-serif;
  font-size: 16px;
  line-height: 1.4;
  overflow-x: hidden;
}
button, input, select {
  font-family: inherit;
  color: inherit;
}
:focus-visible {
  outline: 3px solid var(--primary-teal);
  outline-offset: 2px;
}

.app {
  max-width: 480px;
  margin: 0 auto;
  min-height: 100vh;
  background: var(--bg);
  position: relative;
  padding-bottom: 76px;
}

/* Header bar */
.header-bar {
  background: var(--brand-dark);
  color: #FFFFFF;
  padding: 14px 16px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.header-left {
  display: flex;
  align-items: center;
  gap: 12px;
}
.header-icon {
  width: 36px;
  height: 36px;
  border-radius: 10px;
  background: var(--primary-teal);
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}
.header-titles {
  display: flex;
  flex-direction: column;
}
.header-title {
  font-size: 18px;
  font-weight: 700;
  line-height: 1.2;
}
.header-pond {
  font-size: 13px;
  opacity: 0.85;
  line-height: 1.2;
  margin-top: 2px;
}
.header-date {
  font-size: 13px;
  opacity: 0.85;
  white-space: nowrap;
}

/* Cards */
.dash-content {
  padding: 16px;
  display: flex;
  flex-direction: column;
  gap: 14px;
}
.screen-feed-content {
  padding: 16px;
}
.card {
  background: var(--card-bg);
  border: 1px solid var(--border);
  border-radius: 20px;
  padding: 18px 20px;
}
.status-card {
  display: flex;
  gap: 16px;
  align-items: flex-start;
}
.status-circle {
  width: 44px;
  height: 44px;
  min-width: 44px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 22px;
  font-weight: 700;
  color: #FFFFFF;
  line-height: 1;
}
.harvest-card {
  border-radius: 16px;
  padding: 14px 18px;
  font-size: 15px;
  color: var(--ink);
  line-height: 1.4;
}

/* Chips and Pills */
.pill {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  padding: 3px 10px;
  border: 1.5px solid var(--primary-teal);
  border-radius: 14px;
  font-size: 14px;
  font-weight: 700;
  line-height: 1.2;
  white-space: nowrap;
}
.chip-demo {
  display: inline-block;
  background: var(--demo-yellow);
  color: var(--ink);
  border-radius: 6px;
  padding: 3px 8px;
  font-size: 13px;
  font-weight: 700;
  line-height: 1.2;
  white-space: nowrap;
}
.chip-demo-sm {
  display: inline-block;
  background: var(--demo-yellow);
  color: var(--ink);
  border-radius: 4px;
  padding: 1px 5px;
  font-size: 11px;
  font-weight: 700;
  line-height: 1.2;
  margin-top: 4px;
  white-space: nowrap;
}

/* Download button */
.btn-download {
  outline: 2px solid var(--primary-teal);
  border: none;
  border-radius: 14px;
  min-height: 52px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  color: var(--primary-teal);
  font-size: 16px;
  font-weight: 700;
  text-decoration: none;
  background: var(--card-bg);
  cursor: pointer;
  width: 100%;
}

/* Segmented switch */
.seg {
  display: grid;
  grid-template-columns: 1fr 1fr;
  border: 1.5px solid var(--border);
  border-radius: 14px;
  overflow: hidden;
  background: #FFFFFF;
  margin-bottom: 16px;
}
.seg button {
  min-height: 48px;
  border: none;
  background: #FFFFFF;
  color: var(--muted);
  font-size: 15px;
  font-weight: 700;
  cursor: pointer;
  padding: 0 8px;
}
.seg button + button {
  border-left: 1.5px solid var(--border);
}
.seg button.on {
  background: var(--primary-teal);
  color: #FFFFFF;
}

/* Forms */
.fld {
  margin-bottom: 14px;
}
.fld label {
  display: block;
  font-size: 15px;
  font-weight: 600;
  color: var(--ink);
  margin-bottom: 6px;
}
.fld input {
  height: 52px;
  width: 100%;
  border: 1.5px solid var(--border);
  border-radius: 12px;
  padding: 0 14px;
  font-size: 16px;
  font-weight: 600;
  background: #FFFFFF;
  color: var(--ink);
}
.fld.bad input {
  border-color: var(--warm-red);
}
.hint {
  margin: 6px 0 0;
  font-size: 13px;
  color: var(--muted);
  line-height: 1.35;
}
.err {
  margin: 6px 0 0;
  font-size: 14px;
  font-weight: 600;
  color: var(--warm-red);
}
.saved-msg {
  border: 1.5px solid var(--primary-teal);
  border-radius: 12px;
  padding: 12px 16px;
  font-weight: 700;
  font-size: 15px;
  color: var(--primary-teal);
  background: #FFFFFF;
  margin-bottom: 14px;
}
.btn.go {
  background: var(--primary-teal);
  color: #FFFFFF;
  border: none;
  border-radius: 14px;
  min-height: 52px;
  font-size: 17px;
  font-weight: 700;
  width: 100%;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  margin-top: 14px;
}

/* Bottom bar navigation */
.bottom-bar {
  position: fixed;
  bottom: 0;
  left: 50%;
  transform: translateX(-50%);
  width: 100%;
  max-width: 480px;
  background: #FFFFFF;
  border-top: 1px solid var(--border);
  display: grid;
  grid-template-columns: 1fr 1fr;
  height: 56px;
  z-index: 100;
}
.tab-btn {
  background: transparent;
  border: none;
  border-top: 3px solid transparent;
  color: var(--muted);
  font-size: 15px;
  font-weight: 600;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  padding: 0;
  height: 100%;
}
.tab-btn.on {
  color: var(--primary-teal);
  font-weight: 700;
  border-top-color: var(--primary-teal);
}
</style>
</head>
<body>
<main class="app">
  <!-- Header bar -->
  <header class="header-bar">
    <div class="header-left">
      <div class="header-icon" aria-hidden="true">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M5 15c0-5 4-9 9-9 3 0 5 1.5 6 4"/>
          <path d="M20 10c-3 0-5 2-5 4s2 3 4 3"/>
          <path d="M5 15c1 2 3 3 6 3"/>
          <circle cx="16.5" cy="8.5" r="0.75" fill="#FFFFFF"/>
        </svg>
      </div>
      <div class="header-titles">
        <span class="header-title">Nhật ký nuôi</span>
        <span class="header-pond" id="header-pond-name"></span>
      </div>
    </div>
    <div class="header-date" id="header-today-date"></div>
  </header>

  <!-- Screen 1: Dashboard (Nhật ký) -->
  <section id="screen-dash">
    <div id="dash-content" class="dash-content"></div>
  </section>

  <!-- Screen 2: Feed and setup (Thức ăn, cài đặt) -->
  <section id="screen-setup" hidden class="screen-feed-content">
    <div id="set-saved-msg" class="saved-msg" role="status" style="display:none"></div>

    <div class="seg" role="tablist">
      <button type="button" class="on" data-seg="feed" id="seg-btn-feed" role="tab" aria-selected="true">Nhập thức ăn</button>
      <button type="button" data-seg="setup" id="seg-btn-setup" role="tab" aria-selected="false">Cài đặt</button>
    </div>

    <!-- Feed pane -->
    <section data-pane="feed" id="pane-feed" class="card">
      <h3 style="margin:0 0 16px;font-size:20px;font-weight:700;color:var(--ink)">Nhập thức ăn</h3>
      <div class="fld">
        <label for="feed-date">Ngày</label>
        <input id="feed-date" type="date">
      </div>
      <div class="fld" id="fld-feed-kg">
        <label for="feed-kg">Thức ăn mỗi ngày (kg)</label>
        <input id="feed-kg" type="text" inputmode="decimal">
      </div>
      <div class="fld" id="fld-feed-price">
        <label for="feed-price">Giá thức ăn (đồng mỗi kg)</label>
        <input id="feed-price" type="text" inputmode="decimal">
        <p class="hint">Lấy từ cài đặt. Thay đổi nếu giá thức ăn đổi.</p>
      </div>
      <button class="btn go" id="save-feed-btn" type="button">Lưu</button>
      <div id="feed-form-err" role="alert" style="display:none"></div>
    </section>

    <!-- Setup pane -->
    <section data-pane="setup" id="pane-setup" class="card" hidden>
      <h3 style="margin:0 0 16px;font-size:20px;font-weight:700;color:var(--ink)">Cài đặt</h3>
      <div class="fld">
        <label for="setup-name">Tên ao</label>
        <input id="setup-name" type="text">
      </div>
      <div class="fld">
        <label for="setup-price">Giá thức ăn mặc định (đồng mỗi kg)</label>
        <input id="setup-price" type="text" inputmode="decimal">
      </div>
      <div class="fld">
        <label for="setup-ruler">Chiều dài thước (mm)</label>
        <input id="setup-ruler" type="text" inputmode="decimal">
      </div>
      <div class="fld">
        <label for="setup-card">Chiều dài thẻ tham chiếu (mm)</label>
        <input id="setup-card" type="text" inputmode="decimal">
      </div>
      <div class="fld">
        <label for="setup-stall">Ngưỡng "tôm lớn chậm" (mm mỗi ngày)</label>
        <input id="setup-stall" type="text" inputmode="decimal">
      </div>
      <div class="fld">
        <label for="setup-harvest">Cỡ tôm tham khảo (con/kg)</label>
        <input id="setup-harvest" type="text" inputmode="decimal">
      </div>
      <div class="fld">
        <label for="setup-min">Số con tối thiểu mỗi lần đo</label>
        <input id="setup-min" type="text" inputmode="decimal">
      </div>
      <div class="fld">
        <label for="setup-min-length">Con ngắn nhất được tính (mm)</label>
        <input id="setup-min-length" type="text" inputmode="decimal">
        <p class="hint">Con ngắn hơn bị coi là mảnh vụn và bị loại.</p>
      </div>
      <div class="fld">
        <label for="setup-ration">Thức ăn mỗi ngày (phần trăm thể trọng)</label>
        <input id="setup-ration" type="text" inputmode="decimal">
        <p class="hint">Khoảng 1,5 ở cỡ 25 g. Chỉ dùng để tính, không ảnh hưởng gợi ý.</p>
      </div>
      <button class="btn go" id="save-setup-btn" type="button">Lưu cài đặt</button>
      <div id="setup-form-err" role="alert" style="display:none"></div>
    </section>
  </section>

  <!-- Sticky bottom bar -->
  <nav class="bottom-bar" aria-label="Điều hướng">
    <button type="button" class="tab-btn on" aria-current="page" data-screen="dashboard" id="nav-dash">Nhật ký</button>
    <button type="button" class="tab-btn" data-screen="feed" id="nav-setup">Thức ăn, cài đặt</button>
  </nav>
</main>

<script>
"use strict";

// Helper perKgText using Math.round
function perKgText(value, fallback = "ngoài bảng cỡ") {
  if (value === null || value === undefined) return fallback;
  if (typeof value === "string" && isNaN(Number(value))) return value;
  const n = Number(value);
  if (isNaN(n)) return fallback;
  return String(Math.round(n));
}

// Convert length in mm to cm with one decimal and decimal comma
function f1cm(mm) {
  if (mm === null || mm === undefined || isNaN(mm)) return "-";
  const cm = Number(mm) / 10;
  return cm.toFixed(1).replace(".", ",");
}

// Format number with two decimal places and decimal comma
function f2vn(val) {
  if (val === null || val === undefined || isNaN(val)) return "-";
  return Number(val).toFixed(2).replace(".", ",");
}

// Format threshold number with decimal comma
function formatThresh(val) {
  if (val === null || val === undefined || isNaN(val)) return "-";
  return String(val).replace(".", ",");
}

// Return browser local date formatted as YYYY-MM-DD
function todayIso() {
  const now = new Date();
  const y = now.getFullYear();
  const m = String(now.getMonth() + 1).padStart(2, "0");
  const d = String(now.getDate()).padStart(2, "0");
  return `${y}-${m}-${d}`;
}

// Format today's date as dd/mm/yyyy
function formatTodayVn() {
  const now = new Date();
  const d = String(now.getDate()).padStart(2, "0");
  const m = String(now.getMonth() + 1).padStart(2, "0");
  const y = now.getFullYear();
  return `${d}/${m}/${y}`;
}

// Escape HTML special characters
function esc(s) {
  if (s === null || s === undefined) return "";
  return String(s)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#39;");
}

// Parse numeric input from form fields
function parseNumber(text, opts) {
  const integer = Boolean(opts && opts.integer);
  if (text === null || text === undefined) return null;
  const s = String(text).trim();
  if (!s) return null;
  if (integer && /^\d{1,3}([.,]\d{3})+$/.test(s)) {
    const cleaned = s.replace(/[.,]/g, "");
    const val = parseInt(cleaned, 10);
    return isNaN(val) ? null : val;
  }
  if (/^\d+([.,]\d+)?$/.test(s)) {
    const normalized = s.replace(",", ".");
    const val = parseFloat(normalized);
    if (isNaN(val)) return null;
    return integer ? Math.round(val) : val;
  }
  return null;
}

// Set error message under form field
function setFieldError(inputEl, msg) {
  const fld = inputEl.closest(".fld");
  if (!fld) return;
  let err = fld.querySelector(".field-err");
  if (msg) {
    fld.classList.add("bad");
    if (!err) {
      err = document.createElement("p");
      err.className = "err field-err";
      err.setAttribute("role", "alert");
      fld.appendChild(err);
    }
    err.textContent = msg;
    err.style.display = "block";
  } else {
    fld.classList.remove("bad");
    if (err) {
      err.textContent = "";
      err.style.display = "none";
    }
  }
}

// Clear field errors within container
function clearFieldErrors(container) {
  container.querySelectorAll(".fld.bad").forEach(f => f.classList.remove("bad"));
  container.querySelectorAll(".field-err").forEach(e => {
    e.textContent = "";
    e.style.display = "none";
  });
}

// Global cached settings and form state
let currentSettings = null;
let feedDateEdited = false;
let feedPriceEdited = false;

// Refresh feed form defaults when opening feed screen
function refreshFeedDefaults() {
  if (!feedDateEdited) {
    const feedDate = document.getElementById("feed-date");
    if (feedDate) feedDate.value = todayIso();
  }
  if (!feedPriceEdited && currentSettings && currentSettings.feed_price_vnd !== undefined) {
    const feedPrice = document.getElementById("feed-price");
    if (feedPrice) feedPrice.value = currentSettings.feed_price_vnd;
  }
}

// Resolve URL fragment to a screen name: #dashboard (default), #feed
function routeFromHash() {
  const h = location.hash.replace(/^#/, "").toLowerCase();
  if (h === "feed") return "feed";
  return "dashboard";
}

// Switch active screen and update navigation state
function switchScreen(target) {
  const screens = {
    feed: document.getElementById("screen-setup"),
    dashboard: document.getElementById("screen-dash")
  };
  const btns = {
    feed: document.getElementById("nav-setup"),
    dashboard: document.getElementById("nav-dash")
  };
  if (!screens[target]) target = "dashboard";

  Object.keys(screens).forEach(k => {
    const on = (k === target);
    screens[k].hidden = !on;
    if (on) {
      btns[k].classList.add("on");
      btns[k].setAttribute("aria-current", "page");
    } else {
      btns[k].classList.remove("on");
      btns[k].removeAttribute("aria-current");
    }
  });

  if (target === "feed") {
    refreshFeedDefaults();
    loadSettings();
  } else if (target === "dashboard") {
    loadDashboard();
    loadSettings();
  }
}

// Fetch active settings and populate setup form
async function loadSettings() {
  try {
    const resp = await fetch("/api/settings");
    if (!resp.ok) return;
    currentSettings = await resp.json();

    const pondHeader = document.getElementById("header-pond-name");
    if (pondHeader && currentSettings.pond_name) {
      pondHeader.textContent = currentSettings.pond_name;
    }

    const nameEl = document.getElementById("setup-name");
    if (nameEl) nameEl.value = currentSettings.pond_name || "";

    const priceEl = document.getElementById("setup-price");
    if (priceEl) priceEl.value = currentSettings.feed_price_vnd !== undefined ? currentSettings.feed_price_vnd : "";

    const rulerEl = document.getElementById("setup-ruler");
    if (rulerEl) rulerEl.value = currentSettings.ruler_mm !== undefined ? currentSettings.ruler_mm : "";

    const cardEl = document.getElementById("setup-card");
    if (cardEl) cardEl.value = currentSettings.card_mm !== undefined ? currentSettings.card_mm : "";

    const stallEl = document.getElementById("setup-stall");
    if (stallEl) stallEl.value = currentSettings.stall_mm_per_day !== undefined ? currentSettings.stall_mm_per_day : "";

    const harvestEl = document.getElementById("setup-harvest");
    if (harvestEl) harvestEl.value = currentSettings.harvest_per_kg !== undefined ? currentSettings.harvest_per_kg : "";

    const minEl = document.getElementById("setup-min");
    if (minEl) minEl.value = currentSettings.min_measured !== undefined ? currentSettings.min_measured : "";

    const minLenEl = document.getElementById("setup-min-length");
    if (minLenEl) minLenEl.value = currentSettings.min_length_mm !== undefined ? currentSettings.min_length_mm : "";

    const rationEl = document.getElementById("setup-ration");
    if (rationEl) rationEl.value = currentSettings.ration_pct !== undefined ? currentSettings.ration_pct : "";

    refreshFeedDefaults();
  } catch (_) {}
}

// Fetch dashboard data and render "Nhật ký" layout
async function loadDashboard() {
  const target = document.getElementById("dash-content");
  try {
    const resp = await fetch("/api/dashboard");
    if (!resp.ok) {
      target.innerHTML = '<div class="card"><p class="err" role="alert">Không tải được dữ liệu.</p></div>';
      return;
    }
    const d = await resp.json();

    if (d.empty) {
      target.innerHTML = '<div class="card status-card"><div><div style="font-size:19px;font-weight:700;color:var(--ink);margin-bottom:6px">Chưa có lần đo nào</div><div style="font-size:15px;color:var(--muted)">Gửi ảnh khay tôm cho bot trên Messenger để bắt đầu.</div></div></div>';
      return;
    }

    const rows = d.rows || [];
    const lastRow = rows.length > 0 ? rows[rows.length - 1] : null;
    const isDemo = lastRow ? Boolean(lastRow.demo) : false;
    const notices = d.notices || [];

    // 1. Card "latest"
    let dayMonth = "";
    if (lastRow && lastRow.day) {
      const p = String(lastRow.day).split("-");
      dayMonth = (p.length >= 3) ? `${p[2]}/${p[1]}` : lastRow.day;
    }

    const demoChipHtml = isDemo ? '<span class="chip-demo">dữ liệu mẫu</span>' : '';

    let sizeNumberHtml = '';
    const isOutsideTable = (d.latest_size_per_kg === null || d.latest_size_per_kg === undefined || notices.includes("outside_table"));
    if (isOutsideTable) {
      sizeNumberHtml = '<div style="font-size:32px;font-weight:800;color:var(--ink);margin:14px 0 10px;line-height:1.1">ngoài bảng cỡ</div>';
    } else {
      sizeNumberHtml = `<div style="margin:14px 0 10px;line-height:1;display:flex;align-items:baseline;gap:8px"><span style="font-size:68px;font-weight:800;color:var(--ink);font-variant-numeric:tabular-nums">${perKgText(d.latest_size_per_kg)}</span><span style="font-size:20px;font-weight:600;color:var(--ink)">con/kg</span></div>`;
    }

    const latestCardHtml = `<div class="card"><div style="display:flex;justify-content:space-between;align-items:flex-start"><div><div style="font-size:15px;font-weight:600;color:var(--ink)">Lần đo mới nhất</div><div style="font-size:14px;color:var(--muted);margin-top:2px">${dayMonth} - ${d.n_latest || 0} con</div></div>${demoChipHtml}</div>${sizeNumberHtml}<div style="font-size:17px;color:var(--ink)">Tôm dài trung bình <b>${f1cm(d.latest_length_mm)} cm</b></div></div>`;

    // 2. Card "status"
    let circleBg = "var(--amber)";
    let circleIcon = "?";
    let statusTitle = "";
    let statusBody = "";
    let statusHint = "";

    if (d.stall === true) {
      circleBg = "var(--warm-red)";
      circleIcon = "↓";
      statusTitle = "Tôm đang lớn chậm";
      statusBody = `Khoảng ${f2vn(d.growth_mm_per_day)} mm mỗi ngày, dưới mức ${formatThresh(d.stall_threshold_mm_per_day)} bạn đặt.`;
      statusHint = '<div style="font-size:13px;color:var(--muted);margin-top:6px">Chỉ là gợi ý, bạn quyết định.</div>';
    } else if (d.stall === false) {
      circleBg = "var(--primary-teal)";
      circleIcon = "✓";
      statusTitle = "Tôm vẫn đang lớn";
      statusBody = `Khoảng ${f2vn(d.growth_mm_per_day)} mm mỗi ngày.`;
    } else if (d.stall === null && d.stall_unclear) {
      circleBg = "var(--amber)";
      circleIcon = "?";
      statusTitle = "Chưa xác định được";
      statusBody = "Kích thước tôm dao động lên xuống. Cần đo nhiều mẫu để xác định chính xác.";
    } else if (d.n_previous === null || d.n_previous === undefined) {
      circleBg = "var(--amber)";
      circleIcon = "?";
      statusTitle = "Mới có một lần đo";
      statusBody = "Đo lại sau vài ngày để xem tôm có lớn không.";
    } else if (notices.includes("same_day")) {
      circleBg = "var(--amber)";
      circleIcon = "?";
      statusTitle = "Hai lần đo cùng ngày";
      statusBody = "Chưa so sánh được. Đo lại sau vài ngày.";
    } else if (notices.includes("not_enough_shrimp")) {
      circleBg = "var(--amber)";
      circleIcon = "?";
      statusTitle = "Chưa đủ số con để so";
      const minCount = (d.min_measured !== null && d.min_measured !== undefined) ? d.min_measured : 5;
      statusBody = `Cần ít nhất ${minCount} con mỗi lần đo.`;
    } else {
      circleBg = "var(--amber)";
      circleIcon = "?";
      statusTitle = "Chưa xác định được";
      statusBody = "Kích thước tôm dao động lên xuống. Cần đo nhiều mẫu để xác định chính xác.";
    }

    const statusCardHtml = `<div class="card status-card"><div class="status-circle" style="background:${circleBg}">${circleIcon}</div><div style="flex:1"><div style="font-size:19px;font-weight:700;color:var(--ink);line-height:1.3;margin-bottom:4px">${statusTitle}</div><div style="font-size:15px;color:var(--muted);line-height:1.4">${statusBody}</div>${statusHint}</div></div>`;

    // 3. Optional slim card if at_harvest
    let harvestCardHtml = "";
    if (d.at_harvest) {
      harvestCardHtml = `<div class="card harvest-card">Tôm đã đạt cỡ ${d.harvest_threshold_per_kg} con/kg bạn đặt. Chỉ để bạn tham khảo, bạn quyết định.</div>`;
    }

    // 4. Card "Các lần đo"
    const reversed = rows.slice().reverse();
    const rowsHtml = reversed.map((r, i) => {
      const p = String(r.day).split("-");
      const dayNum = (p.length >= 3) ? parseInt(p[2], 10) : r.day;
      const monthNum = (p.length >= 3) ? parseInt(p[1], 10) : "";

      const demoChip = r.demo ? '<span class="chip-demo-sm">mẫu</span>' : '';
      const lenCm = f1cm(r.mean_length_mm);
      const sizeText = (r.size_per_kg !== null && r.size_per_kg !== undefined)
        ? `${perKgText(r.size_per_kg)} con/kg`
        : "ngoài bảng cỡ";

      let rightHtml = "";
      if (i === reversed.length - 1) {
        rightHtml = '<span style="color:var(--muted);font-size:14px">lần đầu</span>';
      } else {
        const prevRow = reversed[i + 1];
        if (r.mean_length_mm !== null && prevRow.mean_length_mm !== null) {
          const diff = r.mean_length_mm - prevRow.mean_length_mm;
          let diffStr = "";
          if (diff >= 0) {
            diffStr = "+" + diff.toFixed(1).replace(".", ",") + " mm";
          } else {
            diffStr = "−" + Math.abs(diff).toFixed(1).replace(".", ",") + " mm";
          }
          const isWarmRed = (i === 0 && d.stall === true);
          const pillColor = isWarmRed ? 'var(--warm-red)' : 'var(--primary-teal)';
          rightHtml = `<span class="pill" style="border-color:${pillColor};color:${pillColor}">${diffStr}</span>`;
        } else {
          rightHtml = '<span style="color:var(--muted);font-size:14px">-</span>';
        }
      }

      const borderTopStyle = (i > 0) ? 'border-top:1px solid var(--border);' : '';
      return `<div class="sample-row" style="display:grid;grid-template-columns:52px 1fr auto;gap:12px;align-items:center;padding:12px 0;${borderTopStyle}"><div><div style="font-size:24px;font-weight:800;line-height:1;color:var(--ink)">${dayNum}</div><div style="font-size:12px;font-weight:600;color:var(--muted);margin-top:2px">thg ${monthNum}</div>${demoChip}</div><div><div style="font-size:17px;font-weight:700;color:var(--ink)">${lenCm} cm</div><div style="font-size:14px;color:var(--muted);margin-top:2px">${sizeText} &middot; ${r.n_measured} con</div></div><div style="display:flex;align-items:center;justify-content:flex-end">${rightHtml}</div></div>`;
    }).join("");

    const samplesCardHtml = `<div class="card"><div style="font-size:17px;font-weight:700;color:var(--ink);margin-bottom:10px">Các lần đo</div><div>${rowsHtml}</div></div>`;

    // 5. Button-like link to /api/samples.csv
    const downloadLinkHtml = `<a href="/api/samples.csv" download class="btn-download"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg><span>Tải bảng (mở bằng Excel)</span></a>`;

    target.innerHTML = latestCardHtml + statusCardHtml + harvestCardHtml + samplesCardHtml + downloadLinkHtml;
  } catch (_) {
    target.innerHTML = '<div class="card"><p class="err" role="alert">Không tải được dữ liệu.</p></div>';
  }
}

// Save feed form submission handler
async function saveFeedHandler() {
  const pane = document.getElementById("pane-feed");
  const errEl = document.getElementById("feed-form-err");
  const savedEl = document.getElementById("set-saved-msg");
  clearFieldErrors(pane);
  errEl.style.display = "none";
  errEl.innerHTML = "";
  savedEl.style.display = "none";

  const feedDateInput = document.getElementById("feed-date");
  const kgInput = document.getElementById("feed-kg");
  const priceInput = document.getElementById("feed-price");

  const dayVal = feedDateInput.value;
  const kg = parseNumber(kgInput.value, { integer: false });
  const price = parseNumber(priceInput.value, { integer: true });

  let hasError = false;
  if (kg === null) {
    setFieldError(kgInput, "Nhập số bình thường, ví dụ 100 hoặc 45000.");
    hasError = true;
  }
  if (price === null) {
    setFieldError(priceInput, "Nhập số bình thường, ví dụ 100 hoặc 45000.");
    hasError = true;
  }
  if (hasError) return;

  const payload = {
    day: dayVal,
    kg_per_day: kg,
    price_vnd: price
  };

  try {
    const resp = await fetch("/api/feed", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload)
    });
    if (!resp.ok) {
      let errText = "Không lưu được.";
      try {
        const errData = await resp.json();
        if (errData && errData.error) errText = errData.error;
      } catch (_) {}
      errEl.innerHTML = `<p class="err" role="alert">${esc(errText)}</p>`;
      errEl.style.display = "block";
      return;
    }
    savedEl.textContent = "Đã lưu.";
    savedEl.style.display = "block";
  } catch (_) {
    errEl.innerHTML = '<p class="err" role="alert">Không lưu được.</p>';
    errEl.style.display = "block";
  }
}

// Save setup form submission handler
async function saveSetupHandler() {
  const pane = document.getElementById("pane-setup");
  const errEl = document.getElementById("setup-form-err");
  const savedEl = document.getElementById("set-saved-msg");
  clearFieldErrors(pane);
  errEl.style.display = "none";
  errEl.innerHTML = "";
  savedEl.style.display = "none";

  const nameVal = document.getElementById("setup-name").value;
  const priceInput = document.getElementById("setup-price");
  const rulerInput = document.getElementById("setup-ruler");
  const cardInput = document.getElementById("setup-card");
  const stallInput = document.getElementById("setup-stall");
  const harvestInput = document.getElementById("setup-harvest");
  const minInput = document.getElementById("setup-min");
  const minLengthInput = document.getElementById("setup-min-length");
  const rationInput = document.getElementById("setup-ration");

  const price = parseNumber(priceInput.value, { integer: true });
  const ruler = parseNumber(rulerInput.value, { integer: false });
  const card = cardInput ? parseNumber(cardInput.value, { integer: false }) : 85.6;
  const stall = parseNumber(stallInput.value, { integer: false });
  const harvest = parseNumber(harvestInput.value, { integer: false });
  const min = parseNumber(minInput.value, { integer: true });
  const minLength = parseNumber(minLengthInput.value, { integer: false });
  const ration = parseNumber(rationInput.value, { integer: false });

  let hasError = false;
  if (price === null) {
    setFieldError(priceInput, "Nhập số bình thường, ví dụ 100 hoặc 45000.");
    hasError = true;
  }
  if (ruler === null) {
    setFieldError(rulerInput, "Nhập số bình thường, ví dụ 100 hoặc 45000.");
    hasError = true;
  }
  if (cardInput && card === null) {
    setFieldError(cardInput, "Nhập số bình thường, ví dụ 100 hoặc 45000.");
    hasError = true;
  }
  if (stall === null) {
    setFieldError(stallInput, "Nhập số bình thường, ví dụ 100 hoặc 45000.");
    hasError = true;
  }
  if (harvest === null) {
    setFieldError(harvestInput, "Nhập số bình thường, ví dụ 100 hoặc 45000.");
    hasError = true;
  }
  if (min === null) {
    setFieldError(minInput, "Nhập số bình thường, ví dụ 100 hoặc 45000.");
    hasError = true;
  }
  if (minLength === null) {
    setFieldError(minLengthInput, "Nhập số bình thường, ví dụ 100 hoặc 45000.");
    hasError = true;
  }
  if (ration === null) {
    setFieldError(rationInput, "Nhập số bình thường, ví dụ 100 hoặc 45000.");
    hasError = true;
  }
  if (hasError) return;

  const payload = {
    pond_name: nameVal,
    feed_price_vnd: price,
    ruler_mm: ruler,
    card_mm: card,
    stall_mm_per_day: stall,
    harvest_per_kg: harvest,
    min_measured: min,
    min_length_mm: minLength,
    ration_pct: ration
  };

  try {
    const resp = await fetch("/api/settings", {
      method: "PUT",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload)
    });
    if (!resp.ok) {
      let errText = "Không lưu được cài đặt.";
      try {
        const errData = await resp.json();
        if (errData && errData.error) errText = errData.error;
      } catch (_) {}
      errEl.innerHTML = `<p class="err" role="alert">${esc(errText)}</p>`;
      errEl.style.display = "block";
      return;
    }
    currentSettings = await resp.json();
    const pondHeader = document.getElementById("header-pond-name");
    if (pondHeader && currentSettings.pond_name) {
      pondHeader.textContent = currentSettings.pond_name;
    }
    savedEl.textContent = "Đã lưu cài đặt.";
    savedEl.style.display = "block";
  } catch (_) {
    errEl.innerHTML = '<p class="err" role="alert">Không lưu được cài đặt.</p>';
    errEl.style.display = "block";
  }
}

// Wire interaction handlers and lifecycle
document.addEventListener("DOMContentLoaded", () => {
  const dateEl = document.getElementById("header-today-date");
  if (dateEl) {
    dateEl.textContent = formatTodayVn();
  }

  const feedDateInput = document.getElementById("feed-date");
  const feedPriceInput = document.getElementById("feed-price");
  if (feedDateInput) {
    feedDateInput.addEventListener("input", () => { feedDateEdited = true; });
    feedDateInput.addEventListener("change", () => { feedDateEdited = true; });
  }
  if (feedPriceInput) {
    feedPriceInput.addEventListener("input", () => { feedPriceEdited = true; });
    feedPriceInput.addEventListener("change", () => { feedPriceEdited = true; });
  }

  const saveFeedBtn = document.getElementById("save-feed-btn");
  if (saveFeedBtn) {
    saveFeedBtn.addEventListener("click", saveFeedHandler);
  }
  const saveSetupBtn = document.getElementById("save-setup-btn");
  if (saveSetupBtn) {
    saveSetupBtn.addEventListener("click", saveSetupHandler);
  }

  document.addEventListener("click", e => {
    const screenBtn = e.target.closest("[data-screen]");
    if (screenBtn) {
      const targetHash = "#" + screenBtn.dataset.screen;
      if (location.hash === targetHash) {
        switchScreen(routeFromHash());
      } else {
        location.hash = targetHash;
      }
      return;
    }

    const segBtn = e.target.closest("[data-seg]");
    if (segBtn) {
      const parent = document.getElementById("screen-setup");
      parent.querySelectorAll("[data-seg]").forEach(b => {
        const isSelected = (b === segBtn);
        b.classList.toggle("on", isSelected);
        b.setAttribute("aria-selected", isSelected ? "true" : "false");
      });
      parent.querySelectorAll("[data-pane]").forEach(p => {
        p.hidden = (p.dataset.pane !== segBtn.dataset.seg);
      });
      return;
    }
  });

  window.addEventListener("hashchange", () => {
    switchScreen(routeFromHash());
  });

  switchScreen(routeFromHash());
  loadSettings();
});
</script>
